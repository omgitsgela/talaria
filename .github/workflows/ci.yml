name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    # Pinned: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19, which would
    # change the runner OS under us with no code change. Pin the image so the
    # toolchain and OS stay deterministic. Bump deliberately when we want the
    # newer image (and re-verify the Flutter action against it).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Matches the local gate: errors and warnings fail, info lints are listed.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
