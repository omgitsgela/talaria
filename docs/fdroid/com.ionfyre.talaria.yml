# F-Droid build metadata for Talaria.
#
# This is the file submitted to https://gitlab.com/fdroid/fdroiddata as
# `metadata/com.ionfyre.talaria.yml`. The application ID is com.ionfyre.talaria,
# under a domain the project owns.
#
# F-Droid builds every app from source in a clean environment and signs the
# result with its own key, so the release key used for the GitHub releases is
# irrelevant here.
#
# Field reference: https://f-droid.org/docs/Build_Metadata_Reference/
# The build steps follow the pattern used by other Flutter apps in fdroiddata
# (see `metadata/app.alextran.immich.yml`), which clone the Flutter SDK through
# a srclib and drive `flutter build apk --release` directly. The policy
# explicitly permits the Android SDK, Flutter SDK and Hermes to use their
# official prebuilt binaries until Debian packaging exists.
#
# Store listing text, screenshots and the per-version changelog come from
# `fastlane/metadata/android/en-US/` in this repository, so no `Description`
# field is needed here.
#
# Keep versionName / versionCode / commit in step with the tag being built: they
# must match the APK's own values exactly.

Categories:
  - Internet

License: MIT
AuthorName: omgitsgela
WebSite: https://github.com/omgitsgela/talaria
SourceCode: https://github.com/omgitsgela/talaria
IssueTracker: https://github.com/omgitsgela/talaria/issues
Changelog: https://github.com/omgitsgela/talaria/releases

AutoName: Talaria

RepoType: git
Repo: https://github.com/omgitsgela/talaria

Builds:
  - versionName: 1.2.1
    versionCode: 30
    commit: v1.2.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.2
    rm:
      - test
      - tool
      - docs
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.2.1
CurrentVersionCode: 30
