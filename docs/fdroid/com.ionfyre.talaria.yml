# F-Droid build metadata for Talaria.
#
# This is the file submitted to https://gitlab.com/fdroid/fdroiddata as
# `metadata/com.ionfyre.talaria.yml`. The application ID is com.ionfyre.talaria,
# under a domain the project owns.
#
# F-Droid builds every app from source in a clean environment and signs the
# result with its own key, so the release key used for the GitHub releases is
# irrelevant here.
#
# Field reference: https://f-droid.org/docs/Build_Metadata_Reference/
# The build steps follow the convention used by other Flutter apps in
# fdroiddata (see `metadata/app.alextran.immich.yml`): the `flutter` srclib is
# cloned at its `stable` branch, and a prebuild step checks out the exact SDK
# version this project declares in pubspec.yaml. That indirection is deliberate:
# the SDK version lives in the project it applies to, so a version bump does not
# need a metadata change, and it is why pubspec.yaml pins Flutter exactly
# (`flutter: 3.47.2`) rather than using a `>=` range their tooling cannot read.
# The policy explicitly permits the Android SDK, Flutter SDK and Hermes to use
# their official prebuilt binaries until Debian packaging exists.
#
# Store listing text, screenshots and the per-version changelog come from
# `fastlane/metadata/android/en-US/` in this repository, so no `Description`
# field is needed here.
#
# Keep versionName / versionCode / commit in step with the tag being built: they
# must match the APK's own values exactly.

Categories:
  - Internet

License: MIT
AuthorName: omgitsgela
WebSite: https://github.com/omgitsgela/talaria
SourceCode: https://github.com/omgitsgela/talaria
IssueTracker: https://github.com/omgitsgela/talaria/issues
Changelog: https://github.com/omgitsgela/talaria/releases

AutoName: Talaria

RepoType: git
Repo: https://github.com/omgitsgela/talaria

Builds:
  - versionName: 1.3.4
    versionCode: 43
    commit: v1.3.4
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      # `stable` is the branch their builder clones; the exact SDK version is
      # checked out in prebuild, from pubspec.yaml.
      - flutter@stable
    rm:
      - test
      - tool
      - docs
    prebuild:
      - export flutterVersion=$(sed -n -E "s/.*flutter:\s([0-9.]+)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
# Reads the version out of pubspec.yaml at the tagged commit, so future releases
# need no metadata edit either.
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.3.4
CurrentVersionCode: 43
